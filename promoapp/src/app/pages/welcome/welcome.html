<div class="card">
  <h1>Новая продажа</h1>
</div>
<div class="card">
  <div class="card__block"><h2>Тип рекламы</h2>
    <nz-radio-group [(ngModel)]="radioValue" nzButtonStyle="solid">
      <label nz-radio-button nzValue="A">Канал</label>
      <label nz-radio-button nzValue="B">Товар</label>
      <label nz-radio-button nzValue="C">Другое</label>
    </nz-radio-group></div>
  <div class="card__block">
    <h2>Форматы рекламы</h2>
    <nz-radio-group [(ngModel)]="radioValue2">
      @for (o of options; track o.value) {
        <label nz-radio [nzValue]="o.value">{{ o.label }}</label>
      }
    </nz-radio-group>
  </div>
  <div class="card__block">
    <h2>Менеджер</h2>
    <nz-select ngModel="lucy">
      <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
      <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
      <nz-option nzValue="disabled" nzLabel="Disabled" nzDisabled></nz-option>
    </nz-select>
  </div>
  <div class="card__block">
    <h2>Покупатель</h2>
    <input nz-input placeholder="@username" [(ngModel)]="value" type="number" />
  </div>
</div>
<div class="card">
  <button nz-button nzType="primary">Создать продажу</button>
</div>
